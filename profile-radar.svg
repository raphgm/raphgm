<svg xmlns="http://www.w3.org/2000/svg" width="550" height="320" viewBox="0 0 550 320">
  <!-- 100% Transparent Background -->
  <rect width="100%" height="100%" fill="none"/>
  <text x="275" y="34" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Activity Overview</text>
  
  <!-- Axes -->
  <line x1="150" y1="160" x2="350" y2="160" stroke="#484f58" stroke-width="1.5"/>
  <line x1="250" y1="60" x2="250" y2="260" stroke="#484f58" stroke-width="1.5"/>

  <!-- Grid Rings -->
  <circle cx="250" cy="160" r="25.0" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="250" cy="160" r="50.0" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="250" cy="160" r="75.0" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="250" cy="160" r="100" fill="none" stroke="#484f58" stroke-width="1"/>

  <!-- Radar Polygon (GitHub Green) -->
  <polygon points="172.0,160.0 250.0,152.0 258.0,160.0 250.0,175.0" fill="#238636" fill-opacity="0.45" stroke="#3fb950" stroke-width="2.5"/>
  <circle cx="172.0" cy="160" r="4.5" fill="#3fb950"/>
  <circle cx="250" cy="152.0" r="4.5" fill="#3fb950"/>
  <circle cx="258.0" cy="160" r="4.5" fill="#3fb950"/>
  <circle cx="250" cy="175.0" r="4.5" fill="#3fb950"/>

  <!-- Axis Labels -->
  <text x="138" y="164" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">78% Commits</text>
  <text x="250" y="48" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5% Code review</text>
  <text x="362" y="164" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start">2% Issues</text>
  <text x="250" y="282" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">15% Pull requests</text>
</svg>