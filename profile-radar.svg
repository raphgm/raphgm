<svg xmlns="http://www.w3.org/2000/svg" width="550" height="320" viewBox="0 0 550 320">
  <!-- Clean White Background -->
  <rect width="100%" height="100%" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="275" y="34" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Activity Overview</text>
  
  <!-- Axes -->
  <line x1="150" y1="160" x2="350" y2="160" stroke="#8c959f" stroke-width="1.5"/>
  <line x1="250" y1="60" x2="250" y2="260" stroke="#8c959f" stroke-width="1.5"/>

  <!-- Grid Rings -->
  <circle cx="250" cy="160" r="25.0" fill="none" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="250" cy="160" r="50.0" fill="none" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="250" cy="160" r="75.0" fill="none" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="250" cy="160" r="100" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <!-- Radar Polygon (GitHub Green) -->
  <polygon points="172.0,160.0 250.0,152.0 258.0,160.0 250.0,175.0" fill="#2da44e" fill-opacity="0.30" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="172.0" cy="160" r="4.5" fill="#1a7f37"/>
  <circle cx="250" cy="152.0" r="4.5" fill="#1a7f37"/>
  <circle cx="258.0" cy="160" r="4.5" fill="#1a7f37"/>
  <circle cx="250" cy="175.0" r="4.5" fill="#1a7f37"/>

  <!-- Axis Labels -->
  <text x="138" y="164" fill="#24292f" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">78% Commits</text>
  <text x="250" y="48" fill="#24292f" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5% Code review</text>
  <text x="362" y="164" fill="#24292f" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start">2% Issues</text>
  <text x="250" y="282" fill="#24292f" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">15% Pull requests</text>
</svg>